<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعہ حفظ و ناظرہ - ڈیجیٹل ڈائری</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&family=Readex+Pro:wght@400;600&display=swap');
        body {
            font-family: 'Readex Pro', 'Jameel Noori Nastaleeq', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-6">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-800">جامعہ حفظ و ناظرہ</h1>
            <p class="text-sm text-gray-500">روزانہ کارکردگی اور واٹس ایپ رپورٹنگ پورٹل</p>
        </div>

        <!-- لاگ ان سیکشن -->
        <div id="login-section" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">استاد کا نام / آئی ڈی</label>
                <input type="text" id="teacher-name" placeholder="اپنا نام درج کریں" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">کلاس منتخب کریں</label>
                <select id="class-select" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
                    <option value="حفظ کلاس اول">حفظ کلاس اول</option>
                    <option value="حفظ کلاس دوم">حفظ کلاس دوم</option>
                </select>
            </div>
            <button onclick="goToDiaryForm()" class="w-full bg-emerald-700 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-800 transition">
                لاگ ان کریں
            </button>

            <!-- نگران کے لیے نئی کلاس ایڈ کرنے کا بٹن -->
            <div class="border-t pt-4 mt-4 text-center">
                <button onclick="openAddClassModal()" class="text-sm text-emerald-700 font-semibold hover:underline">
                    + نئی کلاس یا استاد شامل کریں (نگران پینل)
                </button>
            </div>
        </div>

        <!-- ڈائری کا فارم -->
        <div id="diary-section" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-emerald-50 p-3 rounded-lg border border-emerald-200">
                <span id="display-teacher" class="text-sm font-bold text-emerald-900">استاد: ---</span>
                <button onclick="logout()" class="text-xs text-red-600 underline">لاگ آؤٹ</button>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">طالب علم کا نام</label>
                <input type="text" id="student-name" placeholder="طالب علم کا نام لکھیں" class="w-full px-4 py-2 border rounded-lg text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">والد کا واٹس ایپ نمبر (میسج کے لیے)</label>
                <input type="text" id="whatsapp-no" placeholder="مثلاً 923001234567" class="w-full px-4 py-2 border rounded-lg text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">حاضری</label>
                <select id="attendance" class="w-full px-4 py-2 border rounded-lg text-sm">
                    <option value="حاضر">حاضر</option>
                    <option value="غیر حاضر">غیر حاضر (چھٹی)</option>
                </select>
            </div>

            <!-- نیا سبق -->
            <div class="border p-3 rounded-lg bg-gray-50 space-y-2">
                <span class="font-bold text-sm text-gray-800">📖 نیا سبق</span>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-600">لائنز کی تعداد</label>
                        <input type="number" id="new-lesson-lines" placeholder="مثلاً 15" class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">کیفیت</label>
                        <select id="new-lesson-quality" class="w-full px-3 py-1.5 border rounded text-sm">
                            <option value="پکا (ممتاز)">پکا (ممتاز)</option>
                            <option value="متوسط (کچا)">متوسط (کچا)</option>
                            <option value="کمزور">کمزور</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- سبقی سپارہ -->
            <div class="border p-3 rounded-lg bg-gray-50 space-y-2">
                <span class="font-bold text-sm text-gray-800">🔄 سبقی سپارہ</span>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-600">سپارہ نمبر</label>
                        <input type="number" id="sabqi-para-no" placeholder="مثلاً 27" class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">کیفیت</label>
                        <select id="sabqi-quality" class="w-full px-3 py-1.5 border rounded text-sm">
                            <option value="پکا">پکا</option>
                            <option value="کچا">کچا</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- منزلی سپارہ -->
            <div class="border p-3 rounded-lg bg-gray-50 space-y-2">
                <span class="font-bold text-sm text-gray-800">📚 منزلی سپارہ</span>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-600">سپارہ نمبر</label>
                        <input type="number" id="manzil-para-no" placeholder="مثلاً 24" class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">کیفیت</label>
                        <select id="manzil-quality" class="w-full px-3 py-1.5 border rounded text-sm">
                            <option value="پکا">پکا</option>
                            <option value="کچا">کچا</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="submitAndSendWhatsApp()" class="w-full bg-emerald-700 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-800 transition">
                مففوظ کریں اور واٹس ایپ پر بھیجیں 📤
            </button>
        </div>

        <!-- نئی کلاس ایڈ کرنے کا ماڈل -->
        <div id="add-class-modal" class="hidden space-y-4 border-t pt-4 mt-4 bg-gray-50 p-3 rounded-lg">
            <h3 class="font-bold text-sm text-emerald-800">➕ نئی کلاس یا استاد کا اضافہ کریں</h3>
            <div>
                <label class="block text-xs text-gray-600 mb-1">نئی کلاس کا نام</label>
                <input type="text" id="new-class-name" placeholder="مثلاً حفظ کلاس چہارم" class="w-full px-3 py-1.5 border rounded text-sm">
            </div>
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="addNewClass()" class="bg-emerald-600 text-white px-4 py-1.5 rounded text-xs font-semibold">شامل کریں</button>
                <button onclick="closeAddClassModal()" class="bg-gray-300 text-gray-700 px-4 py-1.5 rounded text-xs">بند کریں</button>
            </div>
        </div>

        <!-- کامیابی کا پیغام -->
        <div id="success-msg" class="hidden text-center py-6 space-y-3">
            <div class="text-4xl">✅</div>
            <h2 class="text-lg font-bold text-emerald-800">ڈیٹا محفوظ ہو گیا اور واٹس ایپ کھول دیا گیا!</h2>
            <button onclick="resetForm()" class="mt-4 px-4 py-2 bg-gray-200 text-gray-800 rounded-lg text-sm">دوسری انٹری کریں</button>
        </div>

    </div>

    <script>
        function goToDiaryForm() {
            const teacherName = document.getElementById('teacher-name').value;
            if(!teacherName) {
                alert('براہ کرم استاد کا نام درج کریں');
                return;
            }
            document.getElementById('display-teacher').innerText = `استاد: ${teacherName}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('diary-section').classList.remove('hidden');
        }

        function openAddClassModal() {
            document.getElementById('add-class-modal').classList.remove('hidden');
        }

        function closeAddClassModal() {
            document.getElementById('add-class-modal').classList.add('hidden');
        }

        function addNewClass() {
            const className = document.getElementById('new-class-name').value;
            if(!className) {
                alert('براہ کرم کلاس کا نام لکھیں');
                return;
            }
            const selectBox = document.getElementById('class-select');
            const option = document.createElement('option');
            option.value = className;
            option.text = className;
            selectBox.appendChild(option);
            alert(`کامیابی کے ساتھ "${className}" شامل کر دی گئی ہے!`);
            document.getElementById('new-class-name').value = '';
            document.getElementById('add-class-modal').classList.add('hidden');
        }

        function submitAndSendWhatsApp() {
            const studentName = document.getElementById('student-name').value;
            const whatsappNo = document.getElementById('whatsapp-no').value;
            const attendance = document.getElementById('attendance').value;
            const newLines = document.getElementById('new-lesson-lines').value;
            const newQuality = document.getElementById('new-lesson-quality').value;
            const sabqiNo = document.getElementById('sabqi-para-no').value;
            const sabqiQuality = document.getElementById('sabqi-quality').value;
            const manzilNo = document.getElementById('manzil-para-no').value;
            const manzilQuality = document.getElementById('manzil-quality').value;

            if(!studentName || !whatsappNo) {
                alert('براہ کرم طالب علم کا نام اور واٹس ایپ نمبر لازمی درج کریں');
                return;
            }

            // واٹس ایپ میسج کا متن تیار کرنا
            const message = `بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ%0Aمحترم والدِ گرامی، السلام علیکم!%0Aآپ کے فرزند "${studentName}" کی آج کی کارکردگی درج ذیل ہے:%0A%0Aحاضری: ${attendance}%0A📖 نیا سبق: ${newLines} لائنیں (کیفیت: ${newQuality})%0A🔄 سبقی سپارہ (${sabqiNo} واں): ${sabqiQuality}%0A📚 منزلی سپارہ (${manzilNo} واں): ${manzilQuality}%0A%0Aجزاکم اللہ خیراً%0A— جامعہ حفظ و ناظرہ`;

            // واٹس ایپ لنک اوپن کرنا
            const whatsappUrl = `https://wa.me/${whatsappNo}?text=${message}`;
            window.open(whatsappUrl, '_blank');

            document.getElementById('diary-section').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('success-msg').classList.add('hidden');
            document.getElementById('diary-section').classList.remove('hidden');
            document.getElementById('student-name').value = '';
            document.getElementById('whatsapp-no').value = '';
            document.getElementById('new-lesson-lines').value = '';
            document.getElementById('sabqi-para-no').value = '';
            document.getElementById('manzil-para-no').value = '';
        }

        function logout() {
            document.getElementById('diary-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('teacher-name').value = '';
        }
    </script>

</body>
</html>
